name: Build and Release CS2HammerTranslateCN

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Ninja
        run: pip install ninja

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qt5compat'

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

      - name: Build Project
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Run Component Tests
        shell: pwsh
        run: |
          ./build/test_components.exe

      - name: Package Release with windeployqt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Path build/CS2HammerTranslateCN.exe -Destination dist/
          Copy-Item -Path build/qtcore_qm.dll -Destination dist/
          Copy-Item -Path fgd_translations.json -Destination dist/
          Copy-Item -Path qt_translations.json -Destination dist/
          Copy-Item -Path README.md -Destination dist/

          # 运行 windeployqt 打包运行时依赖
          windeployqt --release --no-translations dist/CS2HammerTranslateCN.exe

          # 压缩为 Zip 归档
          Compress-Archive -Path dist/* -DestinationPath CS2HammerTranslateCN-windows-x64.zip -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CS2HammerTranslateCN-windows-x64
          path: CS2HammerTranslateCN-windows-x64.zip
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CS2HammerTranslateCN-windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
