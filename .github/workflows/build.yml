name: Build and Release CS2HammerTranslateCN

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: '版本递增类型 (默认自动递增 patch 小版本)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_tag:
        description: '自定义 Tag (仅在选择 custom 时生效，例如 v1.2.0)'
        required: false
        default: ''
        type: string
      release_name:
        description: 'Release 标题 (留空则默认为 Release <Tag>)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史与 tags，用于版本计算和 Changelog

      - name: Generate Version Info
        id: version
        shell: pwsh
        run: |
          git fetch --tags --force 2>$null
          $bumpType = "${{ inputs.version_bump }}".ToLower()
          if (-not $bumpType) { $bumpType = "patch" }
          $customTag = "${{ inputs.custom_tag }}".Trim()
          $inputReleaseName = "${{ inputs.release_name }}".Trim()
          
          # 获取所有历史 tag，提取语义化版本
          $tags = git tag -l
          $semverList = @()
          foreach ($t in $tags) {
              if ($t -match '^v?(\d+)\.(\d+)\.(\d+)$') {
                  $semverList += [PSCustomObject]@{
                      Tag   = $t
                      Major = [int]$Matches[1]
                      Minor = [int]$Matches[2]
                      Patch = [int]$Matches[3]
                  }
              }
          }
          
          if ($semverList.Count -gt 0) {
              $latest = $semverList | Sort-Object Major, Minor, Patch -Descending | Select-Object -First 1
              $lastTag = $latest.Tag
              $major = $latest.Major
              $minor = $latest.Minor
              $patch = $latest.Patch
          } else {
              $lastTag = ""
              $major = 1
              $minor = 0
              $patch = 0
          }
          
          # 仅在手动触发时进行版本计算与递增
          if ($bumpType -eq "custom" -and $customTag) {
              $version = if ($customTag.StartsWith("v")) { $customTag } else { "v$customTag" }
          } elseif ($bumpType -eq "major") {
              $version = "v$($major + 1).0.0"
          } elseif ($bumpType -eq "minor") {
              $version = "v$($major).$($minor + 1).0"
          } else { # patch 或默认自动自增
              if ($semverList.Count -gt 0) {
                  $version = "v$($major).$($minor).$($patch + 1)"
              } else {
                  $version = "v1.0.0"
              }
          }
          
          $releaseName = if ($inputReleaseName) { $inputReleaseName } else { "Release $version" }
          
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "last_tag=$lastTag" >> $env:GITHUB_OUTPUT
          echo "release_name=$releaseName" >> $env:GITHUB_OUTPUT
          Write-Host "Calculated Version: $version (Previous: $lastTag) | Release: $releaseName"

      - name: Generate Changelog
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $prevTag = "${{ steps.version.outputs.last_tag }}"
          if ($prevTag) {
            $commits = git log "$prevTag..HEAD" --pretty=format:"- %s (%h)"
          } else {
            $commits = git log --pretty=format:"- %s (%h)" -20
          }
          if (-not $commits) {
            $commits = "- Release ${{ steps.version.outputs.version }} update"
          }
          $body = "## What's Changed in ${{ steps.version.outputs.version }}`n`n$($commits -join "`n")`n`n---`n*Released via GitHub Actions*"
          $body | Out-File -FilePath CHANGELOG.md -Encoding utf8
          Write-Host "=== Changelog ===" 
          Get-Content CHANGELOG.md

      - name: Set up MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Ninja
        run: pip install ninja

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qt5compat'

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

      - name: Build Project
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Run Component Tests
        shell: pwsh
        run: |
          ./build/test_components.exe

      - name: Package Release with windeployqt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Path build/CS2HammerTranslateCN.exe -Destination dist/
          Copy-Item -Path build/qtcore_qm.dll -Destination dist/
          Copy-Item -Path fgd_translations.json -Destination dist/
          Copy-Item -Path qt_translations.json -Destination dist/
          Copy-Item -Path README.md -Destination dist/

          # 运行 windeployqt 打包运行时依赖
          windeployqt --release --no-translations dist/CS2HammerTranslateCN.exe

          # 压缩为 Zip 归档
          Compress-Archive -Path dist/* -DestinationPath CS2HammerTranslateCN-windows-x64.zip -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CS2HammerTranslateCN-windows-x64
          path: CS2HammerTranslateCN-windows-x64.zip
          retention-days: 14

      # 仅在 workflow_dispatch 手动触发时发布正式 Release
      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.release_name }}
          body_path: CHANGELOG.md
          files: CS2HammerTranslateCN-windows-x64.zip
          draft: false
          prerelease: false
          make_latest: true
