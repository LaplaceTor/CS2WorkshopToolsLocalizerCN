name: Build and Release CS2HammerTranslateCN

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (例如 v1.0.0，留空则自动按日期生成)'
        required: false
        default: ''
        type: string
      release_name:
        description: 'Release 标题 (留空则自动根据版本号生成)'
        required: false
        default: ''
        type: string
      is_prerelease:
        description: '是否标记为 Pre-release (预发布)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史，用于生成 Changelog

      - name: Generate Version Info
        id: version
        shell: pwsh
        run: |
          $inputTag = "${{ inputs.tag_name }}".Trim()
          $inputReleaseName = "${{ inputs.release_name }}".Trim()
          $inputPrerelease = "${{ inputs.is_prerelease }}"
          
          if ($inputTag) {
            $version = $inputTag
            $isPrerelease = if ($inputPrerelease -eq "true") { "true" } else { "false" }
            $releaseName = if ($inputReleaseName) { $inputReleaseName } else { "Release $version" }
          } elseif ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $version = "${{ github.ref_name }}"
            $isPrerelease = "false"
            $releaseName = if ($inputReleaseName) { $inputReleaseName } else { "Release $version" }
          } else {
            $date = Get-Date -Format "yyyy.MM.dd"
            $version = "v${date}-build.${{ github.run_number }}"
            $isPrerelease = if ($inputPrerelease -eq "true" -or $inputPrerelease -eq "True") { "true" } elseif ($inputPrerelease -eq "false" -or $inputPrerelease -eq "False") { "false" } else { "true" }
            $releaseName = if ($inputReleaseName) { $inputReleaseName } else { "Dev Build $version" }
          }
          
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "is_prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT
          echo "release_name=$releaseName" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version | Prerelease: $isPrerelease | ReleaseName: $releaseName"

      - name: Generate Changelog
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $latestTag = git describe --tags --abbrev=0 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $latestTag) {
            $commits = git log --pretty=format:"- %s (%h)" -20
          } else {
            $commits = git log "$latestTag..HEAD" --pretty=format:"- %s (%h)"
          }
          if (-not $commits) {
            $commits = "- Auto release build"
          }
          $body = "## What's Changed`n`n$($commits -join "`n")`n`n---`n*Manual triggered release via GitHub Actions*"
          $body | Out-File -FilePath CHANGELOG.md -Encoding utf8
          Write-Host "=== Changelog ===" 
          Get-Content CHANGELOG.md

      - name: Set up MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Ninja
        run: pip install ninja

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qt5compat'

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

      - name: Build Project
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Run Component Tests
        shell: pwsh
        run: |
          ./build/test_components.exe

      - name: Package Release with windeployqt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Path build/CS2HammerTranslateCN.exe -Destination dist/
          Copy-Item -Path build/qtcore_qm.dll -Destination dist/
          Copy-Item -Path fgd_translations.json -Destination dist/
          Copy-Item -Path qt_translations.json -Destination dist/
          Copy-Item -Path README.md -Destination dist/

          # 运行 windeployqt 打包运行时依赖
          windeployqt --release --no-translations dist/CS2HammerTranslateCN.exe

          # 压缩为 Zip 归档
          Compress-Archive -Path dist/* -DestinationPath CS2HammerTranslateCN-windows-x64.zip -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CS2HammerTranslateCN-windows-x64
          path: CS2HammerTranslateCN-windows-x64.zip
          retention-days: 14

      # 仅在 workflow_dispatch 手动触发时发布 Release
      # push 和 pull_request 仅构建测试，不发布
      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.release_name }}
          body_path: CHANGELOG.md
          files: CS2HammerTranslateCN-windows-x64.zip
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.version.outputs.is_prerelease != 'true' }}
