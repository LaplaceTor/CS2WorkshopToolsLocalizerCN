name: Release Build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (例如 v1.0.0)'
        required: true
        type: string

jobs:
  build-and-release:
    name: Build & Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 6.8.0
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtnetworkauth'

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DAPP_VERSION="${{ inputs.version }}" -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" ..

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare Package
        run: |
          mkdir package

          # 复制主要文件与翻译字典目录
          Copy-Item "build\CS2WorkshopToolsLocalizerCN.exe" "package\"
          Copy-Item "build\qtcore_qm.dll" "package\"
          Copy-Item "translations" -Destination "package\translations" -Recurse
          if (Test-Path "README.md") { Copy-Item "README.md" "package\" }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "package\" }
          
          $qtBin = Split-Path (Get-Command qmake.exe).Source
          $windeployqt = Join-Path $qtBin "windeployqt.exe"
          
          Write-Host "Qt bin: $qtBin"
          Write-Host "windeployqt: $windeployqt"
          
          if (!(Test-Path $windeployqt)) {
              Write-Error "windeployqt.exe not found at $windeployqt"
              exit 1
          }
          # 运行 windeployqt 收集 Qt 运行时依赖（排除不需要的组件以精简体积）
          & $windeployqt --release --no-translations --no-opengl-sw --no-system-dxc-compiler --no-compiler-runtime "package\CS2WorkshopToolsLocalizerCN.exe"

          # 移除不必要的 Qt 插件和 DLL（本程序无图片/图标/SVG/3D 渲染需求）
          Remove-Item -Recurse -Force "package\imageformats" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "package\iconengines" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "package\generic" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "package\styles" -ErrorAction SilentlyContinue
          Remove-Item -Force "package\Qt6Svg.dll" -ErrorAction SilentlyContinue
          Remove-Item -Force "package\d3dcompiler_47.dll" -ErrorAction SilentlyContinue
          Remove-Item -Force "package\dxcompiler.dll" -ErrorAction SilentlyContinue
          Remove-Item -Force "package\dxil.dll" -ErrorAction SilentlyContinue
          Remove-Item -Force "package\opengl32sw.dll" -ErrorAction SilentlyContinue
          Remove-Item -Force "package\vc_redist.x64.exe" -ErrorAction SilentlyContinue

      - name: Create ZIP Package
        run: |
          $zipName = "CS2WorkshopToolsLocalizerCN-${{ inputs.version }}.zip"
          Compress-Archive -Path "package\*" -DestinationPath $zipName -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: CS2WorkshopToolsLocalizerCN ${{ inputs.version }}
          draft: false
          prerelease: false
          files: CS2WorkshopToolsLocalizerCN-${{ inputs.version }}.zip
          generate_release_notes: true

